# The locked corpus (FD-DEC 008, 2026-10-08). The single source of truth for what is ingested.
# Companies were chosen to cover the four section layouts in docs/design/section-parser.md, not by size.

[windows.10-K]
# By period of report (the fiscal period end), inclusive. That gives 8 annual reports per filer whatever its fiscal
# year end: Apple ends in September, Walmart in January.
period_from = "2018-01-01"
period_to = "2025-12-31"

[windows.10-Q]
# By filing date, inclusive.
filed_from = "2025-01-01"
filed_to = "2026-09-30"

# Amendments (10-K/A, 10-Q/A) are excluded: they are often partial and would break year-over-year pairing.

